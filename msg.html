<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hush | Unfolding Whisper</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
   
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/hush.png" type="image/x-icon">

    <style>
        :root { --glass: rgba(255, 255, 255, 0.02); --border: rgba(255, 255, 255, 0.09); }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #050508; 
            color: #f1f5f9; 
            overflow-x: hidden; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            position: relative;
        }
        .serif { font-family: 'Playfair Display', serif; }
        
        .nav-pill { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--border); 
            z-index: 100; 
        }
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(40px); 
            border: 1px solid var(--border); 
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8); 
        }
        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 5;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.92) 150%);
            opacity: 0; transition: opacity 3s ease;
        }
        .vignette.active { opacity: 1; }
        .reveal-anim { animation: revealUp 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(24px); filter: blur(14px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .typing-dot { 
            width: 5px; height: 5px; background: #6366f1; border-radius: 50%; 
            animation: blink 1.5s infinite both; 
        }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
        .toast { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 640px) {
            .glass-card { padding: 2rem 1.5rem !important; border-radius: 2.5rem; }
            .nav-pill { top: 1rem !important; height: 3.5rem; padding: 0 1rem; }
            #messageBody { font-size: 1.45rem !important; line-height: 1.65; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative overflow-hidden">

    <!-- Background particles -->
    <div id="particles-js" class="absolute inset-0 z-0 pointer-events-none"></div>

    <!-- Vignette overlay -->
    <div id="vignette" class="vignette"></div>

    <!-- Navigation -->
    <div class="fixed top-6 md:top-8 left-0 w-full px-4 md:px-6 flex justify-center z-[100]">
        <nav class="nav-pill w-full max-w-xl rounded-2xl flex items-center justify-between h-14 md:h-16 px-5">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg">
                    <img src="assets/hush.png" alt="Hush Logo" class="w-5 h-5 md:w-6 md:h-6 rounded-md">
                </div>
                <div class="flex flex-col leading-tight">
                    <span class="serif italic text-base md:text-lg">Hush</span>
                    <span class="text-[7px] md:text-[8px] uppercase tracking-widest text-indigo-400 font-bold">Encrypted</span>
                </div>
            </div>
            <a href="index.html" class="px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/6 text-[8px] md:text-[9.5px] uppercase tracking-widest text-slate-400 font-bold hover:bg-white/12 transition-all">
                New Whisper
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 pt-28 md:pt-32 pb-12">
        <div id="mainCard" class="w-full max-w-xl glass-card p-8 md:p-16 rounded-[3rem] relative overflow-hidden">
            
            <!-- Input / Paste stage -->
            <div id="inputStage" class="text-center space-y-7 md:space-y-9">
                <div class="space-y-2.5">
                    <h1 class="serif text-2.5xl md:text-4.5xl italic tracking-tight">Unfold a Whisper</h1>
                    <p class="text-slate-500 text-[8.5px] md:text-[10.5px] uppercase tracking-[0.35em] md:tracking-[0.45em] opacity-80">
                        Paste the secure link
                    </p>
                </div>
                <input id="linkInput" type="text" placeholder="https://...#key..." 
                       class="w-full p-4.5 md:p-5 rounded-2xl bg-black/45 border border-white/10 text-center text-sm md:text-base text-slate-300 placeholder-slate-600 focus:outline-none focus:border-indigo-500/60 transition-all">
                <button id="revealBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4.5 md:py-5 rounded-2xl font-bold tracking-widest text-[9.5px] md:text-[11px] uppercase transition-all shadow-xl shadow-indigo-900/50">
                    Reveal Slowly
                </button>
            </div>

            <!-- Loading / Decrypting stage -->
            <div id="loadingStage" class="hidden text-center py-10 md:py-16">
                <div class="flex justify-center gap-3 mb-7">
                    <div class="typing-dot"></div>
                    <div class="typing-dot" style="animation-delay: 0.25s"></div>
                    <div class="typing-dot" style="animation-delay: 0.5s"></div>
                </div>
                <p class="text-[9.5px] md:text-[11px] uppercase tracking-[0.55em] text-indigo-400 animate-pulse font-bold">
                    Decrypting…
                </p>
            </div>

            <!-- Decrypted message stage -->
            <div id="displayStage" class="hidden">
                <div id="captureArea" class="text-center p-3 md:p-5">
                    <div class="mb-10 md:mb-16">
                        <span class="text-[8.5px] md:text-[10px] uppercase tracking-[0.55em] text-indigo-500 font-bold opacity-70 block mb-3">
                            Message from
                        </span>
                        <h2 id="senderName" class="serif text-2xl md:text-3xl italic text-slate-200"></h2>
                    </div>
                    <div class="mb-10 md:mb-16 px-3 md:px-6">
                        <p id="messageBody" class="serif text-xl md:text-3xl lg:text-4xl leading-relaxed text-slate-100 italic font-light whitespace-pre-wrap break-words"></p>
                    </div>
                    <div id="imgBranding" class="hidden mt-8 opacity-25 serif text-[10.5px] md:text-xs italic tracking-widest uppercase">
                        Hush • AES-256-GCM
                    </div>
                </div>

                <div class="pt-10 border-t border-white/6 flex flex-col sm:flex-row gap-4 md:gap-5">
                    <button id="downloadBtn" class="flex-1 flex items-center justify-center gap-2.5 py-4.5 rounded-2xl bg-white/6 border border-white/8 text-emerald-400 text-[9px] md:text-[10px] font-bold uppercase tracking-widest hover:bg-white/12 transition-all">
                        <i data-lucide="download" class="w-4 h-4"></i> Save Keepsake
                    </button>
                    <button id="replayBtn" class="flex-1 flex items-center justify-center gap-2.5 py-4.5 rounded-2xl bg-white/6 border border-white/8 text-slate-400 text-[9px] md:text-[10px] font-bold uppercase tracking-widest hover:bg-white/12 transition-all">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Replay Animation
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-8 md:p-10 text-center relative z-10 mt-auto">
        <p class="text-[9.5px] md:text-[10.5px] uppercase tracking-[0.45em] text-slate-600 font-medium">
            Hush • <span class="text-indigo-400/85 italic">elitsuv</span> • AES-256-GCM Protected
        </p>
    </footer>

    <div id="notification-container" class="fixed bottom-5 right-5 left-5 md:left-auto md:bottom-10 md:right-10 z-[200] flex flex-col gap-3 items-center md:items-end"></div>

    <script>
        lucide.createIcons();

        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 32, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#6b7280","#a5b4fc","#c4b5fd","#ddd6fe"] },
                "opacity": { "value": 0.14, "random": true, "anim": { "enable": true, "speed": 0.8, "opacity_min": 0.05 } },
                "size": { "value": 1.9, "random": true },
                "line_linked": { "enable": true, "distance": 130, "color": "#6366f1", "opacity": 0.07, "width": 0.7 },
                "move": { "enable": true, "speed": 0.4, "direction": "none", "random": true }
            },
            "interactivity": {
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": false } },
                "modes": { "grab": { "distance": 160, "line_linked": { "opacity": 0.4 } } }
            },
            "retina_detect": true
        });

        const notify = (type, message) => {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            const style = type === 'success' 
                ? 'border-emerald-500/20 text-emerald-400 bg-emerald-950/35' 
                : 'border-red-500/25 text-red-400 bg-red-950/35';
            toast.className = `toast glass-card border w-full md:w-auto flex items-center justify-center gap-3 px-7 py-3.5 rounded-xl text-[9.5px] font-bold uppercase tracking-wider ${style}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'sparkles' : 'alert-circle'}" class="w-4.5 h-4.5"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                setTimeout(() => toast.remove(), 600); 
            }, 3800);
        };

        // ── Crypto Helpers ──────────────────────────────────────────────────
        function toBase64Url(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function fromBase64Url(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) str += '=';
            const binary = atob(str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }

        async function importKey(base64) {
            const raw = fromBase64Url(base64);
            return await crypto.subtle.importKey(
                "raw",
                raw,
                { name: "AES-GCM" },
                false,
                ["decrypt"]
            );
        }

        async function decrypt(key, iv, ciphertext) {
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: fromBase64Url(iv) },
                key,
                fromBase64Url(ciphertext)
            );
            return new TextDecoder().decode(decrypted);
        }

        // ── Reveal logic ────────────────────────────────────────────────────
        async function revealMessage(hash) {
            if (!hash) {
                notify('error', 'No link provided');
                return;
            }

            const parts = hash.split('.');
            if (parts.length !== 5) {
                notify('error', 'Invalid or corrupted link format');
                return;
            }

            const [keyB64, sender, msgLenStr, ivB64, ciphertextB64] = parts;

            document.getElementById('inputStage').classList.add('hidden');
            document.getElementById('loadingStage').classList.remove('hidden');

            try {
                const key = await importKey(keyB64);
                const plaintext = await decrypt(key, ivB64, ciphertextB64);

                // Basic integrity check (optional – length)
                if (plaintext.length !== parseInt(msgLenStr, 10)) {
                    throw new Error("Length mismatch – possible tampering");
                }

                setTimeout(() => {
                    document.getElementById('senderName').textContent = sender || "Anonymous";
                    document.getElementById('messageBody').textContent = plaintext;

                    document.getElementById('loadingStage').classList.add('hidden');
                    document.getElementById('displayStage').classList.remove('hidden');
                    document.getElementById('captureArea').classList.add('reveal-anim');
                    document.getElementById('vignette').classList.add('active');

                    notify('success', 'Whisper revealed');
                }, 1800);
            } catch (err) {
                console.error(err);
                setTimeout(() => {
                    document.getElementById('loadingStage').classList.add('hidden');
                    notify('error', 'Decryption failed – wrong key or tampered message');
                    // Optionally show input stage again
                    document.getElementById('inputStage').classList.remove('hidden');
                }, 1800);
            }
        }

        // Auto-reveal if hash present on load
        if (window.location.hash) {
            revealMessage(window.location.hash.substring(1));
        }

        // Manual paste / button
        document.getElementById('revealBtn').addEventListener('click', () => {
            let val = document.getElementById('linkInput').value.trim();
            let hash = val.includes('#') ? val.split('#')[1] : val;
            revealMessage(hash);
        });

        // Replay animation
        document.getElementById('replayBtn').addEventListener('click', () => {
            const area = document.getElementById('captureArea');
            area.classList.remove('reveal-anim');
            void area.offsetWidth; // force reflow
            area.classList.add('reveal-anim');
        });

        // Download as image
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const brand = document.getElementById('imgBranding');
            brand.classList.remove('hidden');

            html2canvas(document.getElementById('captureArea'), {
                backgroundColor: '#050508',
                scale: 2.5,
                logging: false,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Hush-Whisper-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                brand.classList.add('hidden');
                notify('success', 'Keepsake saved');
            }).catch(() => {
                notify('error', 'Failed to capture image');
                brand.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
